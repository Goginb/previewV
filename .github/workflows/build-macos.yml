name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS dmg and zip
        run: |
          npm run ensure:ffmpeg
          npm run build
          npx electron-builder --mac dmg zip --publish never
          npm run sync:version-marker

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: previewv-macos-${{ github.ref_name || github.sha }}
          retention-days: 30
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
